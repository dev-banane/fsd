# FSD configuration (Docker)
# Override values at runtime with FSD_* environment variables.
# Persistent copies live in /data after the first start.

[system]
clientport=6809
serverport=3011
systemport=3010
ident=FSD
email=nobody@nowhere.com
name=FSD Docker
hostname=localhost
password=disable
location=Nowhere
mode=normal
certificates=cert.txt
maxclients=200
whazzup=whazzup.txt

[connections]
#connectto=
#allowfrom=

[weather]
# NOAA FTP used by "download" is unreliable; "file" keeps the server self-contained.
# Set FSD_WEATHER_SOURCE=download or network if you want live METAR.
source=file
server=weather.noaa.gov
dir=data/observations/metar/cycles/
ftpmode=passive
