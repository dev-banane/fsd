# FSD configuration (Docker)
# Override values at runtime with FSD_* environment variables.
# Persistent copies live in /data after the first start.

[system]
clientport=6809
serverport=3011
systemport=3010
ident=FSD
email=nobody@nowhere.com
name=FSD Docker
hostname=localhost
password=disable
location=Nowhere
mode=normal
certificates=cert.txt
maxclients=200
whazzup=whazzup.txt
# Seconds between WhazzUp regenerations. The webeye map reads this file,
# so keep it low enough for the refresh rate you want.
whazzupinterval=5

[connections]
#connectto=
#allowfrom=

[weather]
# Managed by FSD_WEATHER_SOURCE:
#   file     - read metar.txt, no fetching (self-contained, no live weather)
#   download - entrypoint.sh fetches FSD_METAR_URL over HTTPS into metar.txt
#              every FSD_METAR_INTERVAL seconds; this section stays on "file"
#   network  - relay weather requests to the closest METAR capable server
#   ftp      - legacy in-process FTP download below (NOAA retired it; dead)
source=file
server=tgftp.nws.noaa.gov
dir=data/observations/metar/cycles/
ftpmode=passive
