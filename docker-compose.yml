services:
  fsd:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      FSD_IDENT: ${FSD_IDENT:-FSD}
      FSD_EMAIL: ${FSD_EMAIL:-nobody@nowhere.com}
      FSD_NAME: ${FSD_NAME:-FSD Docker}
      FSD_HOSTNAME: ${FSD_HOSTNAME:-localhost}
      FSD_PASSWORD: ${FSD_PASSWORD:-disable}
      FSD_LOCATION: ${FSD_LOCATION:-Nowhere}
      FSD_CLIENTPORT: "6809"
      FSD_MAXCLIENTS: ${FSD_MAXCLIENTS:-200}
      FSD_CERTS: ${FSD_CERTS:-}
      FSD_MOTD: ${FSD_MOTD:-}
      FSD_WEATHER_SOURCE: ${FSD_WEATHER_SOURCE:-file}
      FSD_WHAZZUP_INTERVAL: ${FSD_WHAZZUP_INTERVAL:-5}
    ports:
      - "6809:6809/tcp"
    volumes:
      - fsd-data:/data
    stop_grace_period: 10s

  webeye:
    build:
      context: ./webeye
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - fsd
    environment:
      TZ: ${TZ:-UTC}
      WEBEYE_WHAZZUP: /data/whazzup.txt
      WEBEYE_POLL: ${WEBEYE_POLL:-5}
      WEBEYE_TITLE: ${WEBEYE_TITLE:-WebEye}
      WEBEYE_HISTORY_POINTS: ${WEBEYE_HISTORY_POINTS:-60}
      WEBEYE_HISTORY_TTL: ${WEBEYE_HISTORY_TTL:-600}
      WEBEYE_VATGLASSES: ${WEBEYE_VATGLASSES:-}
    ports:
      - "${WEBEYE_PORT:-8080}:8080/tcp"
    volumes:
      - fsd-data:/data:ro

volumes:
  fsd-data:
